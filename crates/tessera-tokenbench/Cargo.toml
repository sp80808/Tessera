[package]
name = "tessera-tokenbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reproducible tokenizer benchmark and grammar-candidate comparison for TC syntax decisions (issue #1). Dev tool, not a compiler phase."

[lib]
name = "tessera_tokenbench"
path = "src/lib.rs"

[[bin]]
name = "tess-tokenbench"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tessera-phases = { path = "../tessera-phases" }
tessera-syntax = { path = "../tessera-syntax" }
tiktoken-rs = "0.12.1"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[features]
# HF `tokenizers` JSON loader, pure-Rust regex (fancy-regex): no onig / C++ build.
default = ["hf"]
hf = ["dep:tokenizers"]
