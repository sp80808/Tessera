[package]
name = "tessera-syntax-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_target"
path = "fuzz_target.rs"

[dependencies]
tessera-syntax = { path = ".." }
arbitrary = { version = "1.3", features = ["derive"] }
libfuzzer-sys = { version = "0.4", features = ["link_libfuzzer"] }