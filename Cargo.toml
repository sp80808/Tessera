[workspace]
members = [
    "crates/tessera-phases",
    "crates/tessera-db",
    "crates/tessera-syntax",
    "crates/tessera-hir",
    "crates/tessera-sema",
    "crates/tessera-mir",
    "crates/tessera-tokenbench",
    "crates/tessera-tir",
    "crates/tessera-tcap",
    "crates/tessera-cli",
]
exclude = [
    "crates/tessera-syntax/fuzz",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sp80808/Tessera"
rust-version = "1.85"

[workspace.dependencies]
salsa = "=0.28.5"
criterion = "0.5"